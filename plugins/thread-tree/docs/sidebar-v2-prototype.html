const ACTIONABLE = ['failing', 'conflicts', 'changes', 'ready'];

let mode = 'v2';
const opt = { pr: 'icon', prov: 'slot', tint: 'tint', orch: 'mirror', idle: 'blank', qpr: 'linked', hover: 'overlay' };
const ui = { col: new Set(['gh', 'au']), fold: new Set(['rel']), quiet: new Set(), filter: null, search: false, q: '', more: false, snoozed: new Set() };

const CHOICES = [
  ['pr', 'PR on a thread row', [['icon', 'Tinted icon, only when actionable ★'], ['pill', 'One-word pill'], ['off', 'Nothing'], ['line', 'Second line (today)']]],
  ['prov', 'Provider icon', [['slot', 'Fixed slot, full contrast ★'], ['badge', 'Logo as the status glyph'], ['muted', 'Muted until hover (today)'], ['off', 'Off']]],
  ['tint', 'Provider colour', [['tint', 'Brand tint ★'], ['mono', 'Monochrome']]],
  ['orch', 'Orchestrators', [['mirror', 'Shortcut list + full tree in folders ★'], ['group', 'Moved into their own group'], ['tree', 'Only in project folders (today)']]],
  ['idle', 'Idle thread glyph', [['blank', 'Nothing ★'], ['ring', 'Hollow ring']]],
  ['qpr', 'PRs in Needs you', [['linked', 'Only PRs of my threads ★'], ['all', 'All from GitHub Folder'], ['off', 'None']]],
  ['hover', 'Row hover actions', [['overlay', 'Overlay, nothing moves ★'], ['swap', 'Age swaps for buttons (today)']]],
];

// ---------- shared bits ----------
const kidsOf = (t) => (t.kids || []).map((k) => T[k]);
const allKids = (t) => kidsOf(t).flatMap((k) => [k, ...allKids(k)]);
const isRun = (t) => t.s === 'running';
const prov = (t) => {
  if (opt.prov === 'off' || opt.prov === 'badge') return '';
  return `<span class="pslot pv-${t.pv}" title="${t.pv === 'claude' ? 'Claude Code' : 'Codex'}">${I(t.pv)}</span>`;
};
function glyphCore(t, rollup) {
  const st = rollup || state(t);
  if (st === 'running') return `<span class="spin"></span><span class="stop" data-stop="${t.id}" title="Stop">${I('square', 's')}</span>`;
  if (st === 'input') return `<span class="dot d-input" title="Needs your input"></span>`;
  if (st === 'error') return `<span class="dot d-error" title="${t.qfail ? 'Queued message failed' : 'Turn failed'}"></span>`;
  if (t.draft) return `<span class="muted" title="Unsent draft">${I('pencil', 's')}</span>`;
  if (st === 'new') return `<span class="dot d-new" title="Finished, not read"></span>`;
  return opt.idle === 'ring' ? `<span class="dot d-ring"></span>` : '';
}
function state(t) { return t.s === 'input' ? 'input' : t.s === 'error' || t.qfail ? 'error' : isRun(t) ? 'running' : t.unread ? 'new' : 'idle'; }
const RANKS = ['input', 'error', 'running', 'new', 'idle'];
function urgent(t) { return [t, ...allKids(t)].map(state).sort((a, b) => RANKS.indexOf(a) - RANKS.indexOf(b))[0]; }
function glyph(t, rollup) {
  const core = glyphCore(t, rollup);
  if (opt.prov === 'badge') {
    const st = rollup || state(t);
    const col = { running: 'var(--run)', input: 'var(--attention)', error: 'var(--destructive)', new: 'var(--success)' }[st];
    return `<span class="g ${st === 'running' ? 'canstop' : ''}"><span class="pv-${t.pv}" style="display:grid">${I(t.pv, 's')}</span>${col ? `<span class="pbadge" style="background:${col}${st === 'running' ? ';animation:rot 0s' : ''}"></span>` : ''}${st === 'running' ? `<span class="stop" data-stop="${t.id}" style="position:absolute;background:var(--bg)">${I('square', 's')}</span>` : ''}</span>`;
  }
  return `<span class="g ${(rollup || state(t)) === 'running' ? 'canstop' : ''}">${core}</span>`;
}
function prBit(t) {
  if (t.s === 'error' || opt.pr === 'off' || opt.pr === 'line') return '';
  const p = t.prs.filter((x) => (x.st === 'open' || x.st === 'draft') && ACTIONABLE.includes(x.a)).sort((a, b) => ACTIONABLE.indexOf(a.a) - ACTIONABLE.indexOf(b.a))[0];
  if (!p) return '';
  const [label, cls, icon] = ATT[p.a];
  if (opt.pr === 'pill') return `<span class="pill p-${cls}" title="#${p.n} ${p.title || ''}">${label.split(' ')[0] === 'Checks' ? 'Failing' : label.split(' ')[0] === 'Has' ? 'Conflicts' : label.split(' ')[0] === 'Ready' ? 'Ready' : 'Changes'}</span>`;
  return `<span class="prc ${cls}" title="PR #${p.n} ${p.title || ''} · ${label}">${I(icon, 's')}</span>`;
}
function tip(t) { return [t.t, t.branch ? `branch ${t.branch}` : null, t.pv === 'claude' ? 'Claude Code' : 'Codex', `updated ${t.age === 'now' ? 'just now' : t.age + ' ago'}`].filter(Boolean).join(' · '); }
function sharedWith(t) { if (!t.branch || t.branch === 'main') return null; const o = Object.values(T).find((x) => x !== t && x.branch === t.branch); return o; }

function row(t, depth = 0, o = {}) {
  const ind = 6 + depth * 22;
  const guides = depth ? `<span class="guide ${o.peek ? 'dash' : ''}" style="left:${ind - 14}px;top:0;bottom:0"></span>` : '';
  const sh = sharedWith(t);
  const warn = sh ? `<span class="warn" title="Shares branch ${t.branch} with “${sh.t}”">${I('warn', 's')}</span>` : '';
  const retry = t.s === 'error' || t.qfail ? `<span class="btn danger" data-toast="${t.qfail ? 'Resending the queued message…' : 'Retrying the failed turn…'}">${I('retry', 's')}${t.qfail ? 'Resend' : 'Retry'}</span>` : '';
  const sa = t.sub ? `<span class="sa" title="3 subagents, 2 running">${I('network', 's')}${t.sub}</span>` : '';
  const line = opt.pr === 'line' && t.prs.length ? `<div class="prline" style="margin-left:${ind + 24}px">${t.prs.map((p) => `<span class="prl ${p.st}">${I(p.st === 'open' ? 'open' : p.st, 's')}#${p.n}</span>`).join('')}</div>` : '';
  const actions = opt.hover === 'overlay'
    ? `<span class="ov"><span class="ib" title="Archive" data-toast="Archived · ⌘Z to undo">${I('archive')}</span><span class="ib" title="More actions">${I('more')}</span></span>`
    : `<span class="acts"><span class="ib" style="width:20px;height:20px" title="Archive">${I('archive')}</span><span class="ib" style="width:20px;height:20px" title="More actions">${I('more')}</span></span>`;
  const g = o.rollup ? glyph(t, o.rollup) : glyph(t);
  const fold = t.kids ? `data-fold="${t.id}"` : '';
  return `<div><div class="row ${t.active ? 'active' : ''} ${opt.hover === 'swap' ? 'swap' : ''}" data-row="${t.id}" title="${tip(t)}" style="padding-left:${ind}px">${guides}<span ${fold} style="display:contents;cursor:pointer">${g}</span>
    <span class="ttl ${t.unread ? 'unread' : ''}">${t.t}</span>${retry}${prBit(t)}${warn}${sa}${prov(t)}<span class="age">${t.age}</span>${actions}${o.mk || ''}</div>${line}</div>`;
}
function foldLine(t, depth) {
  const k = allKids(t), n = (st) => k.filter((x) => state(x) === st).length;
  const parts = [['input', 'need input', 'var(--attention)'], ['error', 'failed', 'var(--destructive)'], ['running', 'running', 'var(--run)'], ['new', 'to review', 'var(--success)'], ['idle', 'done', 'color-mix(in oklab, var(--muted-foreground) 50%, transparent)']].map(([st, l, c]) => [n(st), l, c]).filter((p) => p[0]);
  const finished = k.every((x) => state(x) === 'idle') && state(t) === 'idle';
  const bar = k.length >= 5 ? `<span class="bar">${parts.map(([c, , col]) => `<span style="width:${c / k.length * 100}%;background:${col}"></span>`).join('')}</span>` : '';
  return `<div class="row fold" data-fold="${t.id}" style="padding-left:${30 + depth * 22}px"><span class="guide" style="left:${14 + depth * 22}px;top:0;height:12px"></span>${bar}<span class="tiny muted" style="flex:1">${k.length} subthreads${finished ? ' · all done' : ''}${finished ? '' : parts.map(([c, l, col]) => `<span><span class="dot" style="background:${col}"></span>${c} ${l}</span>`).join('')}</span>${finished ? `<span class="btn" data-toast="Archived the orchestration and its subthreads · ⌘Z to undo">${I('archive', 's')}Archive</span>` : ''}</div>`;
}
function subtree(t, depth, marks = {}) {
  const folded = ui.fold.has(t.id);
  let h = row(t, depth, { rollup: folded ? urgent(t) : null, mk: marks[t.id] });
  if (!t.kids) return h;
  if (folded) {
    for (const k of kidsOf(t)) if (k.s === 'input' || k.active) h += row(k, depth + 1, { peek: true });
    return h + foldLine(t, depth);
  }
  for (const k of kidsOf(t)) h += subtree(k, depth + 1, marks);
  return h;
}
function hd(key, icon, title, sum = '', mk = '') {
  const open = !ui.col.has(key);
  return `<div class="hd ${open ? 'isopen' : ''}" data-col="${key}">${icon}<span>${title}</span>${I('chev', 'chev s')}<span class="sum">${sum}</span>${mk}</div>`;
}
const mk = (n, top = '50%') => `<span class="num mk" data-n="${n}" style="top:${top}">${n}</span>`;

// ---------- Needs you ----------
function queue() {
  const items = [];
  const crumb = (t) => t.parent ? ` · under “${T[t.parent].t.slice(0, 18)}…”` : '';
  for (const t of Object.values(T)) {
    if (t.s === 'input') items.push({ r: 0, w: t.wait, id: t.id, t, why: `${t.ask} · <span data-wait="${t.id}">${mins(since(t.wait))}</span>${crumb(t)}` });
    if (t.s === 'error') items.push({ r: 1, id: t.id, t, why: 'Turn failed · 12m ago', act: `<span class="btn danger" data-toast="Retrying…">${I('retry', 's')}Retry</span>` });
    if (t.qfail) items.push({ r: 1, id: t.id, t, why: 'Queued message failed to send', act: `<span class="btn danger" data-toast="Resending…">${I('retry', 's')}Resend</span>` });
    if (t.silent) items.push({ r: 2, id: t.id, t, why: `Running, no output for <span data-wait="${t.id}">${mins(since(t.silent))}</span>${crumb(t)}`, act: `<span class="btn" data-toast="Stopping ${t.t}">${I('square', 's')}Stop</span>` });
    if (t.unread && !isRun(t)) items.push({ r: 3, id: t.id, t, why: `Finished · review the result${crumb(t)}`, hoverAct: `<span class="ib" title="Mark read" data-toast="Marked read">${I('check', 's')}</span>` });
  }
  if (opt.qpr !== 'off') for (const g of GH) {
    if (opt.qpr === 'linked' && !g.thread) continue;
    const th = g.thread && T[g.thread];
    const [label, cls, icon] = ATT[g.a];
    items.push({ r: 4, gh: g, glyph: `<span class="prc ${cls}">${I(icon || 'open', 's')}</span>`, title: `#${g.n} ${g.title}`, why: `${label}${th ? ` · from “${th.t.slice(0, 20)}…”` : ` · ${g.repo}`}`,
      act: g.a === 'ready' ? `<span class="btn" data-toast="Confirm: merge #${g.n} (checks passing)?">${I('merge', 's')}Merge</span>` : !th ? `<span class="btn" data-toast="New thread: review PR #${g.n}">Agent review</span>` : '', go: g.thread });
  }
  items.push({ r: 5, glyph: `<span class="g">${I('zap', 's bad')}</span>`, title: 'Nightly dependency bump', why: 'Automation failed 2h ago', act: `<span class="btn" data-toast="Opening the failed run">Run log</span>`, key: 'auto' });
  return items.filter((it) => !ui.snoozed.has(it.id || it.key || it.title)).sort((a, b) => a.r - b.r || (b.w || 0) - (a.w || 0));
}
function queueRow(it) {
  const t = it.t;
  const g = t ? glyph(t) : it.glyph;
  const title = t ? t.t : it.title;
  const pv = t ? prov(t) : '';
  return `<div class="row two" ${it.id || it.go ? `data-go="${it.id || it.go}"` : ''} title="${title}">${g}<span class="ttl">${title}<span class="sub">${it.why}</span></span>${it.act || ''}${pv}<span class="ov">${it.hoverAct || ''}<span class="ib" title="Snooze until it changes" data-snooze="${it.id || it.key || it.title}">${I('snooze', 's')}</span></span></div>`;
}

// ---------- views ----------
function renderV2() {
  const items = queue();
  const flat = Object.values(T);
  const cnt = { input: flat.filter((t) => t.s === 'input').length, error: flat.filter((t) => t.s === 'error' || t.qfail).length, running: flat.filter(isRun).length, new: flat.filter((t) => t.unread && !isRun(t)).length };
  let h = `<div class="strip">`;
  if (ui.search) {
    h += `<div class="search">${I('search', 's')}<input id="q" placeholder="Title, branch, PR #, project" value="${ui.q}"><span class="kbd">esc</span></div>`;
  } else {
    const sf = (k, inner, label) => `<button class="sf" data-f="${k}" aria-pressed="${ui.filter === k}" title="${label}">${inner}</button>`;
    h += sf('input', `<span class="dot d-input" style="width:7px;height:7px"></span>${cnt.input}`, `${cnt.input} need input`);
    h += sf('error', `<span class="dot d-error" style="width:7px;height:7px"></span>${cnt.error}`, `${cnt.error} failed`);
    h += sf('running', `<span class="spin" style="width:9px;height:9px;animation:none;border-top-color:var(--run)"></span>${cnt.running}`, `${cnt.running} running`);
    h += sf('new', `<span class="dot d-new" style="width:7px;height:7px"></span>${cnt.new}`, `${cnt.new} finished, not read`);
    h += `<span style="flex:1"></span><button class="sf" data-search title="Search ( / )">${I('search', 's')}<span class="kbd">/</span></button><button class="sf" title="Sections">${I('layers', 's')}</button>`;
  }
  h += `${mk(1)}</div>`;

  if (ui.filter || ui.q) {
    const label = { input: 'Need input', error: 'Failed', running: 'Running', new: 'Finished, not read' }[ui.filter] || `Matching “${ui.q}”`;
    const match = flat.filter((t) => ui.q ? [t.t, t.branch, t.proj, ...t.prs.map((p) => '#' + p.n)].join(' ').toLowerCase().includes(ui.q.toLowerCase().replace(/^#/, '#'))
      : ui.filter === 'input' ? t.s === 'input' : ui.filter === 'error' ? (t.s === 'error' || t.qfail) : ui.filter === 'running' ? isRun(t) : (t.unread && !isRun(t)));
    h += `<div class="hd isopen" style="cursor:default">${label}<span class="sum">${match.length} · <span style="cursor:pointer;text-decoration:underline" data-clear>clear</span></span></div>`;
    h += match.map((t) => ui.filter === 'running'
      ? `<div class="row two" data-row="${t.id}" title="${tip(t)}">${glyph(t)}<span class="ttl">${t.t}<span class="sub">${t.step} · ${t.proj}${t.parent ? ' · under ' + T[t.parent].t.slice(0, 14) + '…' : ''}</span></span>${prov(t)}<span class="age" style="width:34px" data-el="${t.id}">${clock(since(t.started))}</span></div>`
      : row(t, 0)).join('') || `<div class="tiny muted" style="padding:6px 10px">Nothing here.</div>`;
    return h;
  }

  if (items.length) {
    const shown = ui.more ? items : items.slice(0, 5);
    h += `<div class="sec">${hd('needs', `<span class="dot d-input" style="width:7px;height:7px"></span>`, 'Needs you', `<span class="kbd">⌘J next</span><span>${items.length}</span>`, mk(2, '13px'))}`;
    if (!ui.col.has('needs')) h += `<div class="queue">${shown.map(queueRow).join('')}${items.length > 5 ? `<div class="tiny muted" data-more style="padding:4px 30px;cursor:pointer">${ui.more ? 'Show less' : `${items.length - 5} more`}</div>` : ''}${mk(3, '45%')}</div>`;
    h += `</div>`;
  }
  const failing = GH.filter((g) => g.a === 'failing').length, conf = GH.filter((g) => g.a === 'conflicts').length;
  h += `<div class="sec">${hd('gh', I('gh', 's'), 'Pull requests', `${failing ? `<span class="bad">${failing} failing</span>` : ''}${conf ? `<span class="bad">${conf} conflicts</span>` : ''}<span>${GH.length}</span>`, mk(4, '13px'))}`;
  if (!ui.col.has('gh')) h += GH.map((g) => { const [label, cls, icon] = ATT[g.a]; return `<div class="row" title="#${g.n} · ${g.repo} · ${label}" ${g.thread ? `data-go="${g.thread}"` : ''}><span class="prc ${cls}">${I(icon || 'open', 's')}</span><span class="ttl">${g.title}</span><span class="tiny muted">${g.repo.replace('app-', '')}</span><span class="ov"><span class="ib" title="Snooze">${I('snooze', 's')}</span><span class="ib" title="Open on GitHub">${I('gh', 's')}</span></span></div>`; }).join('');
  h += `</div>`;
  h += `<div class="sec">${hd('au', I('zap', 's'), 'Automations', `<span class="bad">1 failed</span><span>· next in 12m</span>`)}`;
  if (!ui.col.has('au')) h += AUTOS.map((a) => `<div class="row"><span class="g">${a.st === 'running' ? '<span class="spin"></span>' : a.st === 'error' ? '<span class="dot d-error"></span>' : ''}</span><span class="ttl">${a.name}</span><span class="tiny muted">${a.when}</span><span class="ov"><span class="ib" title="Run now">${I('play', 's')}</span><span class="ib" title="More">${I('more')}</span></span></div>`).join('') + `<div class="tiny muted" style="padding:2px 30px">1 paused</div>`;
  h += `</div><div class="divider"></div>`;
  h += `<div class="hd" style="cursor:default;color:var(--foreground)">Threads<span class="sum muted">${I('archive', 's')} Archived ${I('layers', 's')}</span></div>`;
  h += `<div class="sec">${hd('pin', I('pin', 's'), 'Pinned')}${ui.col.has('pin') ? '' : row(T.plan)}</div>`;
  const orchs = PROJECTS.flatMap((p) => p.roots).map((id) => T[id]).filter((t) => t.kids);
  if (opt.orch === 'mirror') {
    const live = orchs.filter((t) => urgent(t) !== 'idle');
    if (live.length) {
      h += `<div class="sec">${hd('orchs', I('network', 's'), 'Orchestrations', String(live.length), mk(5, '13px'))}`;
      if (!ui.col.has('orchs')) for (const t of live) {
        const k = allKids(t), n = (st) => k.filter((x) => state(x) === st).length;
        const done = k.filter((x) => ['idle', 'new'].includes(state(x))).length;
        const projs = [...new Set([t.proj, ...k.map((x) => x.proj)])];
        const extra = [n('input') ? `<span style="color:var(--attention)">${n('input')} needs you</span>` : '', n('error') ? `<span class="bad">${n('error')} failed</span>` : '', n('running') ? `${n('running')} running` : ''].filter(Boolean).join(' · ');
        h += `<div class="row two" data-reveal="${t.id}" title="Open · the full tree is in ${t.proj}">${glyph(t, urgent(t))}<span class="ttl">${t.t}<span class="sub">${projs.join(' + ')} · ${done}/${k.length} done${extra ? ' · ' + extra : ''}</span></span>${prov(t)}<span class="age">${t.age}</span>${t.id === 'orch' ? mk(6) : ''}</div>`;
      }
      h += `</div>`;
    }
  } else if (opt.orch === 'group') {
    h += `<div class="sec">${hd('orchs', I('network', 's'), 'Orchestrations', String(orchs.length), mk(5, '13px'))}`;
    if (!ui.col.has('orchs')) for (const t of orchs) {
      const projs = [...new Set([t.proj, ...allKids(t).map((k) => k.proj)])];
      h += subtree(t, 0, { orch: mk(6) }).replace(`<span class="ttl ${t.unread ? 'unread' : ''}">${t.t}</span>`, `<span class="ttl">${t.t} <span class="tiny muted" style="font-weight:400">${projs.length > 1 ? projs.join(' + ') : t.proj}</span></span>`);
    }
    h += `</div>`;
  }
  for (const p of PROJECTS) {
    const key = 'p-' + p.name;
    const roots = p.roots.map((id) => T[id]).filter((t) => !(opt.orch === 'group' && t.kids));
    const orchMk = opt.orch === 'mirror' ? {} : { orch: mk(6) };
    const quiet = roots.filter((t) => t.quiet), loud = roots.filter((t) => !t.quiet);
    h += `<div class="sec">${hd(key, I('folder', 's'), p.name, String(roots.length))}`;
    if (!ui.col.has(key)) {
      h += loud.map((t) => subtree(t, 0, { glyph: mk(7), dens: mk(8), ...orchMk })).join('');
      if (quiet.length) {
        const open = ui.quiet.has(key);
        if (open) h += quiet.map((t) => row(t)).join('');
        h += `<div class="row" style="height:26px" data-quiet="${key}" title="Idle, read, no draft, not pinned, PR merged or closed or none, older than 1 day"><span class="g"></span><span class="tiny muted" style="flex:1;cursor:pointer">${open ? 'Hide older' : `${quiet.length} older`}</span>${open ? `<span class="btn" data-toast="Archived ${quiet.length} threads · ⌘Z to undo">${I('archive', 's')}Archive these</span>` : ''}${p.name === 'bb-plugins' ? mk(9) : ''}</div>`;
      }
    }
    h += `</div>`;
  }
  return h;
}

function renderNow() {
  const nowRow = (t, depth = 0, peek) => {
    const st = state(t); const col = { running: 'var(--run)', input: 'var(--attention)', error: 'var(--destructive)' }[st] || 'var(--success)';
    const prs = t.prs.length ? `<div class="prline" style="margin-left:${30 + depth * 24}px">${t.prs.map((p) => `<span class="prl ${p.st}">${I(p.st === 'open' ? 'open' : p.st, 's')}#${p.n}</span>`).join('')}</div>` : '';
    return `<div><div class="row swap" style="padding-left:${6 + depth * 24}px"><span class="g"><span class="dot" style="background:${col}"></span></span><span class="ttl ${t.unread ? 'unread' : ''}">${t.t}</span>${t.s === 'error' ? `<span class="btn danger" style="height:20px">${I('retry', 's')}Retry</span>` : ''}<span class="pslot" style="opacity:.45">${I(t.pv)}</span>${t.sub ? `<span class="sa">● ${t.sub}</span>` : ''}<span class="age">${t.age}</span><span class="acts"><span class="ib" style="width:20px;height:20px">${I('archive')}</span><span class="ib" style="width:20px;height:20px">${I('more')}</span></span></div>${prs}</div>`;
  };
  let h = `<div class="strip tiny muted" style="gap:10px"><span><span class="dot d-input" style="display:inline-block;width:6px;height:6px"></span> 1 need input</span><span><span class="dot d-error" style="display:inline-block;width:6px;height:6px"></span> 2 failed</span><span>3 running</span><span style="margin-left:auto">${I('layers', 's')} Sections</span></div>`;
  h += `<div class="sec">${hd('ngh', I('gh', 's'), 'GitHub', '5')}${ui.col.has('ngh') ? '' : GH.map((g) => `<div class="row swap"><span class="g">${I('open', 's open')}</span><span class="ttl">${g.title}</span><span class="age">#${g.n}</span></div>`).join('')}</div>`;
  h += `<div class="sec">${hd('nau', I('zap', 's'), 'Automations', '3')}${ui.col.has('nau') ? '' : AUTOS.map((a) => `<div class="row"><span class="g"><span class="dot" style="background:${a.st === 'error' ? 'var(--success)' : a.st === 'running' ? 'var(--run)' : 'var(--success)'}"></span></span><span class="ttl">${a.name}</span><span class="tiny muted">${a.st === 'error' ? 'in 22h' : a.when}</span></div>`).join('')}</div>`;
  h += `<div class="sec">${hd('nre', I('clock', 's'), 'Recent Activity', '5')}${ui.col.has('nre') ? '' : [T.glyph, T.k2, T.orch, T.k4, T.crash].map((t) => nowRow(t)).join('')}</div>`;
  h += `<div class="divider"></div><div class="hd" style="cursor:default;color:var(--foreground)">Threads<span class="sum muted">${I('archive', 's')} Archived ${I('layers', 's')}</span></div>`;
  h += `<div class="sec">${hd('npin', I('pin', 's'), 'Pinned')}${nowRow(T.plan)}</div>`;
  for (const p of PROJECTS) {
    h += `<div class="sec">${hd('np' + p.name, I('folder', 's'), p.name, String(p.roots.length))}`;
    if (!ui.col.has('np' + p.name)) for (const id of p.roots) { const t = T[id]; h += nowRow(t); for (const k of allKids(t)) h += nowRow(k, 1); }
    h += `</div>`;
  }
  return h;
}

const NOTES = [
  ['Status strip = filters', 'Counts for need input · failed · running · to review. Click one for a flat list; Running shows the step and a live timer there, not in the tree. <span class="kbd">/</span> searches title, branch, PR # and project. Replaces the chips, the search box and the Running section.', 'Thread Tree'],
  ['Needs you', 'Only things you act on: questions (longest wait first), failed turns, failed queued messages, agents silent for minutes, finished results to review, PRs of your own threads, failed automations. Click a row to open it; a button only for actions that aren’t navigation. Hover for snooze; subthreads say which orchestration they’re under. Hidden when empty.', 'Thread Tree; PRs via GitHub Folder'],
  ['Queue rows', 'Two lines here only: the queue is where the words live. Tree rows stay one line, 32px, so heights never jump.', ''],
  ['PR and Automations summaries', 'Collapsed by default; the header already says what matters (“1 failing · 1 conflicts”). Expanded PR rows show the reason as the icon and the repo; the number lives in the tooltip.', 'GitHub Folder, Automations plugin'],
  ['Orchestrations shortcuts', 'One row per orchestration that still has work going: rolled-up status, the projects it spans, “2/4 done · 1 needs you”. No subthreads here. Click opens it and lights up its full tree in the project folder, which stays the home. Finished orchestrations drop out of this list on their own; Archive stays in the folder.', 'Thread Tree'],
  ['Folded orchestrator', 'Its glyph rolls up the most urgent state below it; a subthread that needs you peeks out (dashed line); the fold line counts by state. A bar only from 5 subthreads. A finished one offers Archive.', 'Thread Tree (peek and fold line exist today)'],
  ['Calm row', 'Glyph · title · Retry · PR icon only when actionable · shared-branch warning · subagent counter · provider in a fixed slot · age. Hover a spinner to get Stop on the left; Archive and ⋯ overlay the right end after 120 ms, nothing moves. Tooltip: branch, provider, updated.', 'bb status glyph + draft + row status from the SDK'],
  ['Shared branch warning', 'Two live threads on one branch or worktree get a ⚠ with the other thread’s name in the tooltip.', 'Thread Tree (environment.branchName)'],
  ['Older threads', '“3 older” instead of a sentence. Strict rule in the tooltip. Archive appears only after you expand it, with ⌘Z undo.', 'Thread Tree'],
];
function renderNotes() {
  if (mode === 'now') return `<p class="muted" style="margin-top:0">Today’s plugin with the same data, including the provider icon and subagent counter it already draws. Expand GitHub to see the full sidebar height.</p>`;
  return `<ol>${NOTES.map(([h, d, src], i) => `<li data-note="${i + 1}"><span class="num">${i + 1}</span><span><b>${h}.</b> ${d}${src ? `<br><span class="src">${src}</span>` : ''}</span></li>`).join('')}</ol>
  <div class="changed"><b>Changed after the design review</b><ul>
  <li>Running section and filter chips dropped; the status strip does both.</li>
  <li>No step text or questions inside the tree; rows are one fixed height.</li>
  <li>PR on rows: a tinted icon, no word, no hover reveal.</li>
  <li>Provider icon: fixed slot, full contrast, optional brand tint.</li>
  <li>Idle threads draw nothing; the subagent counter stays.</li>
  <li>Stop moved off the Archive spot to the spinner.</li>
  <li>Needs you gained review-ready, failed queued messages and stuck agents; PRs only from your threads; snooze.</li>
  <li>Orchestrations moved under Threads, so the top area is shorter than today.</li><li>Your call: orchestrations stay in their folders with the full tree; the section is a flat list of shortcuts.</li></ul></div>`;
}
function renderChoices() {
  $('choices').style.display = mode === 'v2' ? 'flex' : 'none';
  $('choices').innerHTML = CHOICES.map(([k, l, os]) => `<label>${l}<select data-opt="${k}">${os.map(([v, t]) => `<option value="${v}" ${opt[k] === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`).join('');
}
function render() {
  [...$('mode').children].forEach((b) => b.setAttribute('aria-pressed', b.dataset.m === mode));
  renderChoices();
  const sb = $('sb');
  sb.innerHTML = mode === 'now' ? renderNow() : renderV2();
  sb.classList.toggle('hide-mk', !$('mk').checked);
  sb.classList.toggle('mono', opt.tint === 'mono' || mode === 'now');
  sb.classList.toggle('muted-prov', opt.prov === 'muted');
  $('notes').innerHTML = renderNotes();
  const q = $('q'); if (q) { q.oninput = (e) => { ui.q = e.target.value; render(); }; q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function toast(s) { const t = $('toast'); t.textContent = s; t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => (t.style.opacity = 0), 1700); }
document.addEventListener('click', (e) => {
  const c = (s) => e.target.closest(s);
  if (c('[data-m]')) { mode = c('[data-m]').dataset.m; return render(); }
  if (c('[data-stop]')) { e.stopPropagation(); return toast('Stop the running turn (bb’s own Stop)'); }
  if (c('[data-snooze]')) { ui.snoozed.add(c('[data-snooze]').dataset.snooze); toast('Snoozed until it changes'); return render(); }
  if (c('[data-toast]')) return toast(c('[data-toast]').dataset.toast);
  if (c('[data-f]')) { const f = c('[data-f]').dataset.f; ui.filter = ui.filter === f ? null : f; return render(); }
  if (c('[data-clear]')) { ui.filter = null; ui.q = ''; ui.search = false; return render(); }
  if (c('[data-search]')) { ui.search = true; return render(); }
  if (c('[data-more]')) { ui.more = !ui.more; return render(); }
  if (c('[data-fold]')) { const id = c('[data-fold]').dataset.fold; ui.fold.has(id) ? ui.fold.delete(id) : ui.fold.add(id); return render(); }
  if (c('[data-quiet]')) { const k = c('[data-quiet]').dataset.quiet; ui.quiet.has(k) ? ui.quiet.delete(k) : ui.quiet.add(k); return render(); }
  if (c('[data-col]')) { const k = c('[data-col]').dataset.col; ui.col.has(k) ? ui.col.delete(k) : ui.col.add(k); return render(); }
  if (c('[data-reveal]')) {
    const id = c('[data-reveal]').dataset.reveal; ui.fold.delete(id); ui.col.delete('p-' + T[id].proj); render();
    const r = [...document.querySelectorAll(`[data-row="${id}"]`)].pop(); if (r) { r.classList.add('flash'); r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    return toast('Opens the orchestrator; its tree lights up in ' + T[id].proj);
  }
  if (c('[data-go]')) {
    const id = c('[data-go]').dataset.go; ui.filter = null; ui.q = ''; ui.search = false;
    let p = T[id]; while (p && p.parent) { ui.fold.delete(p.parent); p = T[p.parent]; }
    render(); const r = [...document.querySelectorAll(`[data-row="${id}"]`)].pop(); if (r) { r.classList.add('flash'); r.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }
});
document.addEventListener('change', (e) => { const k = e.target.dataset?.opt; if (k) { opt[k] = e.target.value; render(); } });
$('mk').addEventListener('change', render);
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement?.id !== 'q' && mode === 'v2') { e.preventDefault(); ui.search = true; render(); }
  if (e.key === 'Escape' && (ui.search || ui.filter)) { ui.search = false; ui.q = ''; ui.filter = null; render(); }
});
document.addEventListener('mouseover', (e) => {
  document.querySelectorAll('.hl').forEach((x) => x.classList.remove('hl'));
  const li = e.target.closest('[data-note]'); if (li) document.querySelectorAll(`.mk[data-n="${li.dataset.note}"]`).forEach((m) => m.classList.add('hl'));
  const m = e.target.closest('.mk'); if (m) document.querySelector(`[data-note="${m.dataset.n}"]`)?.classList.add('hl');
});
setInterval(() => {
  document.querySelectorAll('[data-el]').forEach((el) => { el.textContent = clock(since(T[el.dataset.el].started)); });
  document.querySelectorAll('[data-wait]').forEach((el) => { const t = T[el.dataset.wait]; el.textContent = mins(since(t.wait || t.silent)); });
}, 1000);
render();
</script>
</body>
</html>
